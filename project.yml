name: Simple Playback
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  "Simple Playback":
    type: application
    platform: macOS
    sources:
      - "Simple Playback"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.simpleplayback
        PRODUCT_NAME: Simple Playback
        PRODUCT_MODULE_NAME: Simple_Playback
        INFOPLIST_FILE: "Simple Playback/Support/Info.plist"
        SWIFT_OBJC_BRIDGING_HEADER: "Simple Playback/Support/SimplePlayback-Bridging-Header.h"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreImage.framework
      - sdk: UniformTypeIdentifiers.framework
  "Simple PlaybackTests":
    type: bundle.unit-test
    platform: macOS
    sources:
      - "Simple PlaybackTests"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.simpleplayback.tests
        PRODUCT_MODULE_NAME: Simple_PlaybackTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Simple Playback.app/Contents/MacOS/Simple Playback"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: "Simple Playback"
schemes:
  "Simple Playback":
    build:
      targets:
        "Simple Playback": all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - "Simple PlaybackTests"
