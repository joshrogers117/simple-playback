name: Simple Playback
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_OBJC_ARC: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1
targets:
  "Simple Playback":
    type: application
    platform: macOS
    sources:
      - "Simple Playback"
    settings:
      base:
        DEVELOPMENT_TEAM: QZ3D4MK87J
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.simpleplayback
        PRODUCT_NAME: Simple Playback
        PRODUCT_MODULE_NAME: Simple_Playback
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        SPARKLE_FEED_URL: https://joshrogers117.github.io/simple-playback/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: "WwIwpidfq9zee0P+4LTuFvIY96vjEg1Tip37co2GZHM="
        INFOPLIST_FILE: "Simple Playback/Support/Info.plist"
        CODE_SIGN_ENTITLEMENTS: "Simple Playback/Support/SimplePlayback.entitlements"
        SWIFT_OBJC_BRIDGING_HEADER: "Simple Playback/Support/SimplePlayback-Bridging-Header.h"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Sparkle
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreImage.framework
      - sdk: UniformTypeIdentifiers.framework
  "Simple PlaybackTests":
    type: bundle.unit-test
    platform: macOS
    sources:
      - "Simple PlaybackTests"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.simpleplayback.tests
        PRODUCT_MODULE_NAME: Simple_PlaybackTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Simple Playback.app/Contents/MacOS/Simple Playback"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: "Simple Playback"
schemes:
  "Simple Playback":
    build:
      targets:
        "Simple Playback": all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - "Simple PlaybackTests"
